<style>
:root{--ink:#26214a;--muted:#7a74a3;--blue:#5b6cff;--mint:#2fb892;--red:#e0455f;--gold:#ffc83d;--card:#fff;--shadow:0 6px 20px #4b3f9422}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,'Noto Sans Hebrew',sans-serif;color:var(--ink);background:linear-gradient(160deg,#eef0ff,#f6efff);-webkit-user-select:none;user-select:none}
button{font:inherit;font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);width:100%;padding:12px 14px;border-radius:14px;border:2px solid #e1deff;background:#fff;-webkit-user-select:text;user-select:text}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 18px}
header{display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
header h1{flex:1;margin:0;font-size:22px}
.chip{background:#fff;border-radius:99px;padding:8px 13px;font-weight:700;box-shadow:var(--shadow);font-size:14px}
main{flex:1;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.sec{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec h3{margin:0 0 10px;font-size:16px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #0000000d}
.row:first-of-type{border-top:0}
.row .e{font-size:28px}.row .m{flex:1;min-width:0;font-weight:700}
.row .m small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.b{border-radius:99px;padding:8px 15px;font-weight:700;background:#eceaff;color:var(--blue);font-size:14px}
.b.ok{background:var(--mint);color:#fff}.b.bad{background:#ffe3ea;color:var(--red)}
.big{display:block;width:100%;padding:14px;border-radius:16px;background:linear-gradient(135deg,#5b6cff,#8a6cff);color:#fff;font-weight:700;font-size:16px;margin-top:12px;text-align:center}
.big.g{background:#fff;color:#4285f4;border:2px solid #dbe4ff;display:flex;gap:10px;align-items:center;justify-content:center}
.lab{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:#f6efff}
nav div{display:flex;width:100%;max-width:520px;background:#fff;border-radius:24px;box-shadow:0 -4px 24px #4b3f9433;padding:6px;pointer-events:auto}
nav button{flex:1;min-width:0;padding:8px 1px;border-radius:18px;font-size:10px;font-weight:700;color:var(--muted);position:relative;line-height:1.15}
nav button.on{background:#eceaff;color:var(--blue)}nav .i{display:block;font-size:20px}
nav .badge{position:absolute;top:0;inset-inline-end:1px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;min-width:18px;padding:1px 5px}
.pmeta{color:var(--muted);font-weight:700;font-size:13px}
.prow{display:flex;align-items:center;gap:8px}
.prow .e{font-size:28px;line-height:1}
.prow .who{flex:1;min-width:0;font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streak{flex:none;background:#fff6e0;color:#9a6b00;border-radius:99px;padding:4px 10px;font-weight:800;font-size:12px;white-space:nowrap}
.streak.off{background:#f3f1ff;color:var(--muted)}
.metric{margin-top:12px}
.metric .ml{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:13px;font-weight:700;margin-bottom:5px}
.metric .ml span{color:var(--muted)}
.metric .ml b{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.pbar{height:12px;border-radius:99px;background:#eceaff;overflow:hidden;display:flex}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#5b6cff,#2fb892)}
.pbar.gold i{background:linear-gradient(90deg,#f0a202,#ffc83d)}
.wdays{display:flex;gap:4px;margin-top:12px}
.wdays div{flex:1;min-width:0;text-align:center;background:#f6f4ff;border-radius:12px;padding:6px 0 5px}
.wdays b{display:block;font-size:10px;color:var(--muted);font-weight:800}
.wdays i{display:block;font-style:normal;font-weight:800;font-size:13px;color:#d4cff0;line-height:1.35}
.wdays .on{background:#e5f8f1}.wdays .on i{color:var(--mint)}
.wdays .today{box-shadow:inset 0 0 0 2px var(--blue)}
.pcard.fam{background:linear-gradient(135deg,#5b6cff,#8a6cff);color:#fff}
.pcard.fam .pmeta,.pcard.fam .metric .ml span,.pcard.fam .wdays b{color:#ffffffd0}
.pcard.fam .streak{background:#ffffff2e;color:#fff}
.pcard.fam .streak.off{background:#ffffff22;color:#fff}
.pcard.fam .pbar{background:#ffffff33}
.pcard.fam .pbar i,.pcard.fam .pbar.gold i{background:#fff}
.pcard.fam .wdays div{background:#ffffff22}
.pcard.fam .wdays i{color:#ffffff66}
.pcard.fam .wdays .on{background:#ffffff38}
.pcard.fam .wdays .on i{color:#fff}
.pcard.fam .wdays .today{box-shadow:inset 0 0 0 2px #fff}
.center{text-align:center;padding-top:60px}.center .logo{font-size:72px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-90px);background:#26214aee;color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;transition:.3s;z-index:50;max-width:90%}
.toast.on{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#26214a99;display:none;align-items:center;justify-content:center;z-index:40;padding:18px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:24px;padding:20px;max-width:380px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.iconbtn{flex:none;width:54px;height:54px;border-radius:50%;background:#eceaff;font-size:28px;padding:0;line-height:1;border:2px solid #e1deff}
.igrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.igrid button{font-size:28px;padding:8px 0;border-radius:14px;background:#f5f3ff;line-height:1.2}
.ichips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.ichips button{white-space:nowrap;padding:6px 12px;font-size:13px}
.qr{width:240px;max-width:100%;margin:10px auto;background:#fff;padding:6px;border-radius:12px}.qr svg{width:100%;height:auto;display:block}
.link{word-break:break-all;font-size:12px;color:var(--muted);-webkit-user-select:text;user-select:text;margin:6px 0}
.tog{width:52px;height:30px;border-radius:99px;background:#d8d4f0;position:relative;transition:.2s;flex:none}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--mint)}.tog.on::after{left:25px}
[dir=rtl] .tog::after{left:auto;right:3px}[dir=rtl] .tog.on::after{right:25px}
.err{color:var(--red);font-weight:700;margin-top:10px}
</style>

async function selectAll(build){
  const page=1000,rows=[];
  for(let from=0;from<8000;from+=page){
    const r=await build().range(from,from+page-1);
    if(r.error) throw r.error;
    const chunk=r.data||[];rows.push(...chunk);
    if(chunk.length<page) break;
  }
  return rows;
}

    sb.from('completions').select('id,kid_id,chore_id,base_coins,bonus,day').eq('household_id',hid).eq('status','approved').gte('day',weekStart()).order('day',{ascending:false})]);

  D.done=dn.data;

async function allGameEvents(hid){
  const page=1000, rows=[];
  for(let from=0; from<8000; from+=page){
    const r=await sb.from('game_events').select('id,game,action').eq('household_id',hid).order('id',{ascending:true}).range(from,from+page-1);
    if(r.error) return r;
    const chunk=r.data||[]; rows.push(...chunk);
    if(chunk.length<page) break;
  }
  return {data:rows};
}
function leastLiked(){
  const by={};
  (D.gameEvents||[]).forEach(r=>{
    const x=by[r.game]||(by[r.game]={s:0,n:0,up:0,down:0});
    if(r.action==='skipped'){x.s++;x.n++}
    else if(r.action==='played')x.n++;
    else if(r.action==='liked')x.up++;
    else if(r.action==='disliked')x.down++;
  });
  return Object.keys(by).filter(g=>by[g].n>=5).map(g=>({g,s:by[g].s,n:by[g].n,up:by[g].up,down:by[g].down,rate:by[g].s/by[g].n})).sort((a,b)=>b.rate-a.rate||b.s-a.s);
}

function todoFor(k){
  const td=todayJ(),dow=new Date(td+'T12:00:00Z').getUTCDay(),ws=weekStart();
  const taken=new Set((D.pending||[]).filter(p=>p.kid_id===k.id&&p.day===td).map(p=>p.chore_id));
  (D.done||[]).forEach(r=>{if(r.kid_id===k.id&&r.day===td)taken.add(r.chore_id)});
  return D.chores.filter(c=>(!c.kid_id||c.kid_id===k.id)&&!taken.has(c.id)&&(c.repeat==='weekly'
    ?(D.done||[]).filter(r=>r.kid_id===k.id&&r.chore_id===c.id&&r.day>=ws).length<(c.weekly_target||1)
    :(!(c.weekdays||[]).length||c.weekdays.includes(dow))));
}

  setInterval(()=>{if(D.user&&D.hh&&!document.hidden&&!editing&&!$('modal').classList.contains('on'))load().then(render).catch(()=>{})},10000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D.user&&!editing)load().then(render).catch(()=>{})});
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
