<style>
  :root{
    --bg1:#ffe9f3; --bg2:#e6e4ff; --ink:#3a2a5c; --muted:#7d6f9c;
    --pink:#ff7eb6; --purple:#8a6cff; --mint:#5fd8b4; --gold:#ffc83d; --card:#ffffffee;
    --shadow:0 8px 24px rgba(110,80,200,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans Hebrew",sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;display:flex;justify-content:center}
  #app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;position:relative}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
  header h1{margin:0;font-size:24px}
  .chip{background:var(--card);border-radius:99px;padding:8px 14px;font-weight:700;box-shadow:var(--shadow);display:inline-flex;gap:6px;align-items:center}
  .tools{display:flex;gap:8px;align-items:center}
  button{font:inherit;font-family:inherit;color:inherit;cursor:pointer;border:0}
  .iconbtn{background:var(--card);border-radius:99px;width:40px;height:40px;box-shadow:var(--shadow);font-size:16px;font-weight:700}
  main{flex:1;padding:8px 20px 110px;overflow-y:auto}
  .hello{font-size:15px;color:var(--muted);margin:0 0 12px}
  .progress{height:14px;background:#fff8;border-radius:99px;overflow:hidden;margin:6px 0 18px;box-shadow:inset 0 1px 3px #0001}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));width:0;transition:width .5s}
  .task{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px;
    box-shadow:var(--shadow);width:100%;text-align:start;transition:transform .15s,background .3s}
  .task:active{transform:scale(.97)}
  .task .emoji{font-size:32px;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:#f3edff}
  .task .t{flex:1;font-size:18px;font-weight:700}
  .task .c{font-size:14px;color:var(--muted);font-weight:600}
  .task .box{width:34px;height:34px;border-radius:50%;border:3px solid #cfc4f5;display:grid;place-items:center;font-size:20px;color:#fff;background:#fff}
  .task.done{background:#e6fbf3}
  .task.done .t{text-decoration:line-through;opacity:.65}
  .task.done .box{background:var(--mint);border-color:var(--mint)}
  .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
  nav{position:fixed;bottom:0;width:100%;max-width:480px;display:flex;background:#fffffff2;backdrop-filter:blur(8px);
    padding:8px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(110,80,200,.12);border-radius:26px 26px 0 0;z-index:5}
  nav button{flex:1;background:none;padding:8px;border-radius:18px;font-weight:700;color:var(--muted);font-size:13px}
  nav button .i{display:block;font-size:26px}
  nav button.on{color:var(--purple);background:#f1ecff}
  .page{display:none}.page.on{display:block}
  .stage{position:relative;border-radius:28px;box-shadow:var(--shadow);overflow:hidden;line-height:0;text-align:center}
  .stage svg{width:100%;height:auto;display:block}
  #avatar .charg{animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 1.3px #5b3a63) drop-shadow(0 0 .6px #5b3a63)}#avatar .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}#avatar .wave{transform-origin:186px 214px;animation:wave 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes wave{50%{transform:rotate(-14deg)}}
  .stage .name{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;background:#ffffffd9;border-radius:99px;padding:4px 18px;line-height:1.4;font-weight:700;font-size:20px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
  .tabs{display:flex;gap:8px;margin:16px 0 10px;overflow-x:auto;padding-bottom:4px}
  .tabs button{background:var(--card);padding:8px 14px;border-radius:99px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow)}
  .tabs button.on{background:var(--purple);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .item{background:var(--card);border-radius:20px;padding:10px 4px;text-align:center;box-shadow:var(--shadow);font-weight:700;font-size:13px}
  .item .big{font-size:34px;display:block}
  .item .sw{display:block;width:44px;height:44px;border-radius:50%;margin:0 auto 4px;border:3px solid #fff;box-shadow:0 2px 6px #0003}
  .item .big svg{width:64px;height:58px;display:block;margin:0 auto 2px;border-radius:12px;background:#f3ecff}
  .item .lbl{display:block;font-size:12px;margin:2px 0}
  .stats{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
  .stats span{background:var(--card);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
  .stage.mini{max-width:230px;margin:0 auto}
  header{position:sticky;top:0;z-index:6;background:linear-gradient(var(--bg1),var(--bg1));padding-bottom:10px}
  .shopstick{position:sticky;top:var(--hh,70px);z-index:4;background:var(--bg1);margin:0 -20px 10px;padding:4px 20px 0}
  .shopstick .stage.mini{max-width:120px}
  .shopstick .tabs{margin:8px 0 6px}.shopstick .tabs.sub{margin:0 0 6px}
  .tabs.seg{margin-top:0}.tabs.seg button{flex:1}
  .tabs.sub{flex-wrap:wrap;overflow:visible;margin:0 0 10px}
  .tabs.sub button{padding:6px 12px;font-size:13px}
  .item .rm svg{width:84px;height:62px}
  .item.sel{outline:3px solid var(--purple)}
  .item .price{display:block;margin-top:2px;color:var(--muted);font-size:12px}
  .item.locked{opacity:.8}
  .overlay{position:fixed;inset:0;background:linear-gradient(160deg,#ffe0f0,#dcd6ff);z-index:20;display:none;flex-direction:column;align-items:center;padding:20px;overflow-y:auto}
  .overlay.on{display:flex}
  .overlay h2{margin:10px 0 2px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:420px;margin:18px 0}
  .card{aspect-ratio:1;perspective:600px;background:none;padding:0}
  .card .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
  .card.flip .in{transform:rotateY(180deg)}
  .card .f,.card .b{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;box-shadow:var(--shadow)}
  .card .b{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-size:28px}
  .card .f{background:#fff;font-size:38px;transform:rotateY(180deg)}
  .card.match .f{background:#e6fbf3}
  .btn{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:700;font-size:18px;padding:14px 28px;border-radius:99px;box-shadow:var(--shadow)}
  .winrow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
  .vote{width:52px;height:52px;border-radius:50%;background:#fff;font-size:26px;box-shadow:var(--shadow);padding:0;line-height:1}
  .vote.on{outline:3px solid var(--purple)}
  .ghost{background:var(--card);color:var(--ink)}
  .win{text-align:center;display:none;margin-top:40px}
  .win.on{display:block}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:40;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.on{opacity:1}

  .holes{grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:380px;margin:16px 0}
  .hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 60%,#7a5a3a,#4b3322);overflow:hidden;position:relative;box-shadow:inset 0 8px 14px #0006;padding:0}
  .hole span{position:absolute;left:0;right:0;bottom:-100%;font-size:46px;transition:bottom .15s;text-align:center;line-height:1}
  .hole.up span{bottom:14%}
  .simon{grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:340px;margin:16px 0}
  .pad{aspect-ratio:1;border-radius:28px;opacity:.5;box-shadow:var(--shadow);transition:transform .1s,opacity .1s}
  .pad.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 28px #fff}
  .count{width:100%;max-width:380px;text-align:center;margin:10px 0}
  #pile{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:46px;min-height:170px;align-content:center;background:var(--card);border-radius:24px;padding:14px;box-shadow:var(--shadow)}
  #opts{display:flex;gap:14px;justify-content:center;margin-top:18px}
  .opt{width:92px;height:92px;border-radius:26px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:40px;font-weight:800;box-shadow:var(--shadow)}

  .ggrid{display:grid;gap:4px;margin:0 auto;width:100%}

  .task.wait{background:#fff6dd}.task.wait .box{border-color:var(--gold);color:var(--ink);font-size:16px}
  .pov{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-y:auto;display:none;justify-content:center}
  .pov.on{display:flex}
  .pin{display:block;width:100%;text-align:center;letter-spacing:12px;font-size:28px}
  #pwrap{width:100%;max-width:480px;padding:18px 20px 40px}
  #pwrap h1{font-size:24px;margin:0}.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .psec{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .psec h3{margin:0 0 10px;font-size:16px}
  .prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #0000000d}.prow:first-of-type{border-top:0}
  .prow .e{font-size:26px}.prow .m{flex:1;font-weight:700}.prow .m small{display:block;color:var(--muted);font-weight:600;font-size:12px}
  .sbtn{border-radius:99px;padding:7px 14px;font-weight:700;background:#f1ecff;color:var(--purple)}
  .sbtn.ok{background:var(--mint);color:#fff}.sbtn.bad{background:#ffe3ea;color:#d63a5e}
  .fld{font:inherit;width:100%;padding:10px 12px;border-radius:14px;border:2px solid #e3dcff;background:#fff;color:var(--ink);margin:4px 0 10px}
  .emj{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.emj button{font-size:22px;background:#f3edff;border-radius:12px;width:40px;height:40px}
  .frow{display:flex;gap:10px}.frow>div{flex:1}
  .lab{font-size:13px;font-weight:700;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">ChoreQuest</h1>
    <div class="tools">
      <button class="iconbtn" id="mute" aria-label="music">🔊</button>
      <button class="iconbtn" id="lang" aria-label="language">עב</button>
      <span class="chip">💰 <span id="coins">0</span></span>
    </div>
  </header>

  <main>
    <section class="page on" id="p-tasks">
      <p class="hello" id="hello"></p>
      <div class="progress"><div id="bar"></div></div>
      <div id="tasks"></div>
      <p class="hint" id="hint"></p>
      <div id="late"></div>
    </section>

    <section class="page" id="p-me">
      <div class="stage"><div class="name" id="hname"></div><div id="avatar"></div></div>
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tabs"></div><div class="tabs sub" id="subtabs"></div>
      <div class="grid" id="shop"></div>
    </section>
    <section class="page" id="p-prizes">
      <div class="tabs seg" id="pzseg"></div>
      <div id="shopview">
        <p class="hello" id="shophello"></p>
        <div class="shopstick"><div class="stage mini"><div id="savatar"></div></div>
        <div class="tabs" id="stabs"></div><div class="tabs sub" id="ssub"></div></div>
        <div class="grid" id="sgrid"></div>
      </div>
      <div id="realview">
      <p class="hello" id="pzhello"></p>
      <div id="prizes"></div>
      </div>
    </section>
  </main>

  <nav>
    <button class="on" data-p="tasks"><span class="i">✅</span><span id="n1"></span></button>
    <button data-p="prizes"><span class="i">🎁</span><span id="n3"></span></button>

  </nav>
</div>

<div class="pov" id="pair"><div id="pwrap">
  <div style="text-align:center;font-size:64px;margin-top:40px">📱</div>
  <h1 id="ptitle" style="text-align:center"></h1>
  <p class="hello" id="pmsg" style="text-align:center"></p>
  <input id="pcode" class="fld" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:100%;margin-top:10px">
  <button class="btn" id="pgo" style="margin-top:14px;width:100%"></button>
</div></div>

<div class="overlay" id="game">

  <div id="gsub" class="hello"></div>
  <div id="gprog" class="hello" style="font-weight:800;font-size:18px"></div>

  <div class="cards" id="cards"></div>

    <div id="wbonus" class="chip" style="margin:8px 0 18px;font-size:20px"></div><br>

  </div>
  <button class="btn ghost" id="skip" style="margin-top:auto"></button>
</div>
<canvas class="confetti" id="confetti"></canvas>
<div class="toast" id="toast"></div>

async function refresh(quiet){
  if(!kidId)return;
  const d0=new Date(Date.now()-8*864e5).toISOString().slice(0,10);
  const p0=new Date(Date.now()-7*864e5).toISOString();
  const [k,ch,co,ki,pz,pq]=await Promise.all([
    sb.from('kids').select('id,name,coins,worn,gender').eq('id',kidId).maybeSingle(),
    sb.from('chores').select('id,title,title_he,icon,coins,game,kid_id,repeat,weekdays,weekly_target').eq('active',true).order('created_at'),
    sb.from('completions').select('id,chore_id,status,base_coins,bonus,day').eq('kid_id',kidId).gte('day',d0),
    sb.from('kid_items').select('item_key').eq('kid_id',kidId),
    sb.from('prizes').select('id,title,title_he,icon,cost').eq('active',true).order('created_at'),
    sb.from('prize_requests').select('id,prize_id,status').eq('kid_id',kidId).in('status',['pending','given']).gte('created_at',p0)]);
  const bad=[k,ch,co,ki,pz,pq].find(x=>x.error);if(bad)throw bad.error;
  if(!k.data){LOC.kid=kidId=null;save();showPair();return}
  S.name=k.data.name;S.coins=k.data.coins;S.gender=k.data.gender;$('meico').textContent=S.gender==='boy'?'👦':'👧';S.worn=normWorn(k.data.worn);
  const own=new Set(ki.data.map(r=>r.item_key));
  Object.keys(SHOP).forEach(t=>SHOP[t].forEach(x=>{if(x.p===0)own.add(t+':'+x.id)}));
  S.own=[...own];
  try{
    const [a,b]=await Promise.all([
      sb.from('completions').select('day').eq('kid_id',kidId).eq('status','approved').gte('day',new Date(Date.now()-60*864e5).toISOString().slice(0,10)),
      sb.from('coin_ledger').select('amount').eq('kid_id',kidId).gt('amount',0)]);
    const days=new Set((a.data||[]).map(r=>r.day));let n=0,t=Date.parse(today()+'T12:00:00Z');
    if(!days.has(new Date(t).toISOString().slice(0,10)))t-=864e5;
    while(days.has(new Date(t).toISOString().slice(0,10))){n++;t-=864e5}
    S.streak=n;S.life=(b.data||[]).reduce((s,r)=>s+r.amount,0);
  }catch(e){}
  const day=today(),dow=new Date(day+'T12:00:00Z').getUTCDay(),ws=new Date(Date.parse(day+'T12:00:00Z')-dow*864e5).toISOString().slice(0,10);
  const weekUsed={};
  co.data.forEach(c=>{if(c.day>=ws&&c.status!=='rejected')weekUsed[c.chore_id]=(weekUsed[c.chore_id]||0)+1});
  S.chores=ch.data;S.comps=co.data;
  S.tasks=ch.data.filter(c=>(!c.kid_id||c.kid_id===kidId)&&!(c.repeat==='daily'&&c.weekdays&&!c.weekdays.includes(dow)))
    .map(c=>({id:c.id,e:c.icon,c:c.coins,g:c.game,name:c.title,he:c.title_he,wk:c.repeat==='weekly'?c.weekly_target:0,used:weekUsed[c.id]||0}));
  const done={};
  co.data.forEach(c=>{if(c.day===day&&c.status!=='rejected')done[c.chore_id]={cid:c.id,status:c.status,paid:c.base_coins+c.bonus}});
  if(quiet)Object.keys(done).forEach(id=>{if(seenPending[id]&&done[id].status==='approved'){toast('🎉 '+L().pr.appr(done[id].paid));chime();confetti()}});
  seenPending={};Object.keys(done).forEach(id=>{if(done[id].status==='pending')seenPending[id]=1});
  S.done=done;S.prizes=pz.data;S.preq=pq.data;renderAll();
}
async function act(fn){
  if(busy)return;busy=true;
  try{await fn();await refresh()}catch(e){toast(L().pr.err);try{await refresh()}catch(_){}}
  busy=false;
}

/* ---------- tasks ---------- */
function renderTasks(){
  const l=L(); $('hello').textContent=l.hello(S.name); $('hint').textContent=l.pa.hint;
  let n=0;$('tasks').innerHTML='';
  S.tasks.forEach(t=>{const d=S.done[t.id],w=isPend(d),full=!d&&t.wk&&t.used>=t.wk; if(d||full)n++;
    const sub=w?'⏳ '+esc(l.pa.waiting):full?esc(l.pz.weekDone):'💰 '+t.c+(t.wk>1?' · '+esc(l.pz.weekN(t.used,t.wk)):'');
    const b=document.createElement('button');b.className='task'+((d&&!w)||full?' done':'')+(w?' wait':'');
    b.innerHTML='<span class="emoji">'+esc(t.e)+'</span><span class="t">'+esc(tname(t))+'<br><span class="c">'+sub+'</span></span><span class="box">'+(w?'⏳':d||full?'✓':'')+'</span>';
    b.onclick=()=>{if(!full)toggleTask(t)};$('tasks').appendChild(b)});
  $('bar').style.width=(S.tasks.length?n/S.tasks.length*100:0)+'%';
  renderLate();
}
function shiftDay(iso,n){return new Date(Date.parse(iso+'T12:00:00Z')+n*864e5).toISOString().slice(0,10)}
function halfCoins(n){n=n|0;return n>0?Math.max(1,Math.floor(n/2)):0}
function lateItems(){
  const y=shiftDay(today(),-1),dow=new Date(y+'T12:00:00Z').getUTCDay(),ws=shiftDay(y,-dow);
  const comps=S.comps||[],doneY={},pend={},used={};
  comps.forEach(c=>{
    if(c.status==='rejected')return;
    if(c.day===y){doneY[c.chore_id]=1;if(c.status==='pending')pend[c.chore_id]=c.id}
    if(c.day>=ws&&c.day<=y)used[c.chore_id]=(used[c.chore_id]||0)+1;
  });
  return (S.chores||[]).filter(c=>!c.kid_id||c.kid_id===kidId).filter(c=>{
    if(c.repeat==='daily'&&c.weekdays&&!c.weekdays.includes(dow))return false;
    if(!pend[c.id]&&doneY[c.id])return false;
    if(c.repeat==='weekly'&&!pend[c.id]&&(used[c.id]||0)>=(c.weekly_target||1))return false;
    return true;
  }).map(c=>({id:c.id,e:c.icon,c:c.coins,name:c.title,he:c.title_he,wait:!!pend[c.id],cid:pend[c.id]}));
}
function renderLate(){
  const l=L(),box=$('late');if(!box)return;
  const items=lateItems();
  box.innerHTML='';
  if(!items.length)return;
  const head=document.createElement('p');head.className='hello';head.style.marginTop='18px';head.textContent=l.late;
  const hint=document.createElement('p');hint.className='hint';hint.style.margin='0 0 10px';hint.textContent=l.lateHint;
  box.appendChild(head);box.appendChild(hint);
  items.forEach(t=>{
    const b=document.createElement('button');b.className='task'+(t.wait?' wait':'');
    const sub=t.wait?'⏳ '+esc(l.pa.waiting):'💰 '+halfCoins(t.c)+' · '+esc(l.lateTag);
    b.innerHTML='<span class="emoji">'+esc(t.e)+'</span><span class="t">'+esc(tname(t))+'<br><span class="c">'+sub+'</span></span><span class="box">'+(t.wait?'⏳':'')+'</span>';
    b.onclick=()=>{
      if(t.wait)act(async()=>{const r=await sb.rpc('cancel_completion',{p_id:t.cid});if(r.error)throw r.error});
      else act(async()=>{const r=await sb.rpc('submit_late_completion',{p_kid:kidId,p_chore:t.id});if(r.error)throw r.error;toast('⏳ '+l.pa.waiting)});
    };
    box.appendChild(b);
  });
}
function renderPrizes(){
  const l=L().pz;$('pzhello').textContent=l.hello;const box=$('prizes');box.innerHTML='';
  if(!S.prizes.length){box.innerHTML='<p class="hint">'+esc(l.empty)+'</p>';return}
  S.prizes.forEach(z=>{
    const rq=S.preq.find(r=>r.prize_id===z.id&&r.status==='pending'),gv=!rq&&S.preq.some(r=>r.prize_id===z.id&&r.status==='given');
    const b=document.createElement('button');b.className='task'+(rq?' wait':'');
    b.innerHTML='<span class="emoji">'+esc(z.icon)+'</span><span class="t">'+esc(S.lang==='he'&&z.title_he?z.title_he:z.title)+'<br><span class="c">'+(rq?'⏳ '+esc(l.wait):(gv?'✓ '+esc(l.got)+' · ':'')+'💰 '+z.cost)+'</span></span>';
    b.onclick=()=>{
      if(rq){act(async()=>{const r=await sb.rpc('cancel_prize_request',{p_id:rq.id});if(r.error)throw r.error});return}
      if(S.coins<z.cost){toast(l.need);return}
      if(!confirm(l.ask(z.cost)))return;
      act(async()=>{const r=await sb.rpc('redeem_prize',{p_kid:kidId,p_prize:z.id});if(r.error)throw r.error;toast('🎁 '+l.asked)})};
    box.appendChild(b)});
}
function toggleTask(t){
  const d=S.done[t.id];
  if(d){
    if(isPend(d))act(async()=>{const r=await sb.rpc('cancel_completion',{p_id:d.cid});if(r.error)throw r.error});
    return }
  pendingTask=t;
  if(t.g==='none'||!L().gm[t.g]){finishTask(0);return}
  openGame();
}
function finishTask(bonus){
  const t=pendingTask; if(!t) return; bonus=bonus||0; pendingTask=null;
  act(async()=>{const r=await sb.rpc('submit_completion',{p_kid:kidId,p_chore:t.id,p_bonus:bonus});if(r.error)throw r.error;toast('⏳ '+L().pa.waiting)});
}
let gameVote=null;
function logGame(action){
  try{
    const g=pendingTask&&pendingTask.g;
    if(!kidId||!g||g==='none')return;
    const p=sb.rpc('log_game_event',{p_kid:kidId,p_game:g,p_action:action});
    if(p&&typeof p.then==='function')p.then(()=>{},()=>{});
  }catch(e){}
}
function clearVote(){
  gameVote=null;
  const up=$('voteup'),dn=$('votedn');
  if(up)up.classList.remove('on');
  if(dn)dn.classList.remove('on');
}
function rateGame(action){
  if(gameVote)return;
  gameVote=action;
  $('voteup').classList.toggle('on',action==='liked');
  $('votedn').classList.toggle('on',action==='disliked');
  $('voteup').setAttribute('aria-pressed',action==='liked'?'true':'false');
  $('votedn').setAttribute('aria-pressed',action==='disliked'?'true':'false');
  logGame(action);
}

/* ---------- game ---------- */
const EM=['🧦','🌸','🦋','🍓','⭐','🐞','🎈','🍩'];
let first=null,lock=false,found=0,raf=null,spawnT=null,memT=null,gameKind='memory',ended=false;
const MEM_TIME=60,ARENA_TIME=30,BONUS_CAP=20;
let domT=[];
function later(fn,ms){const id=setTimeout(fn,ms);domT.push(id);return id}
function runClock(sec,onEnd,hud){const tEnd=Date.now()+sec*1000;const tick=()=>{const s=Math.max(0,Math.ceil((tEnd-Date.now())/1000));hud(s);if(s<=0){clearInterval(memT);memT=null;onEnd()}};tick();memT=setInterval(tick,200)}
function stopArena(){cancelAnimationFrame(raf);raf=null;clearInterval(spawnT);spawnT=null;clearInterval(memT);memT=null;domT.forEach(clearTimeout);domT=[]}
function openGame(){
  stopArena();
  const l=L(),k=gameKind=(pendingTask&&pendingTask.g)||'memory';
  $('gtitle').textContent=l.gm[k][0];$('gsub').textContent=l.gm[k][1];$('done').textContent=l.done;$('skip').textContent=l.skip;$('wintext').textContent=l.win;
  $('win').classList.remove('on');$('skip').style.display='';$('gprog').textContent='';ended=false;clearVote();
  $('cards').style.display='none';$('arena').style.display='none';$('dom').style.display='none';
  $('game').classList.add('on'); startMusic();
  const G={memory:memoryGame,critters:crittersGame,simon:simonGame,count:countGame,queens:queensGame,tennis:tennisGame,flip:flipGame,sudoku:sudokuGame,scramble:scrambleGame,slide:slideGame,reflex:reflexGame,birds:birdsGame};
  if(G[k])G[k]();else arenaGame(k);
}
function memoryGame(){
  $('cards').style.display='grid';
  const pick=EM.slice().sort(()=>Math.random()-.5).slice(0,6);
  const deck=pick.concat(pick).sort(()=>Math.random()-.5);found=0;first=null;lock=false;
  const t0=Date.now(),hud=()=>{const s=Math.max(0,MEM_TIME-Math.floor((Date.now()-t0)/1000));$('gprog').textContent='🃏 '+found+' / 6   ⏱ '+s+L().left;return s};hud();
  memT=setInterval(()=>{if(hud()<=0){clearInterval(memT);memT=null;winGame(found,true)}},250);window._memStart=t0;
  $('cards').innerHTML='';
  deck.forEach(e=>{const c=document.createElement('button');c.className='card';c.dataset.e=e;
    c.innerHTML='<div class="in"><div class="b">?</div><div class="f">'+e+'</div></div>';c.onclick=()=>flip(c);$('cards').appendChild(c)});
}
function flip(c){
  if(lock||c.classList.contains('flip'))return; c.classList.add('flip'); tone(SC[Math.floor(Math.random()*4)],ctx().currentTime,.2,'triangle',.1);
  if(!first){first=c;return}
  if(first.dataset.e===c.dataset.e){chime();first.classList.add('match');c.classList.add('match');first=null;found++;$('gprog').textContent='🃏 '+found+' / 6';if(found===6){clearInterval(memT);memT=null;const sec=(Date.now()-window._memStart)/1000;setTimeout(()=>winGame(6+Math.max(0,Math.round((45-sec)/5)),false),500)}}
  else{lock=true;const a=first;first=null;setTimeout(()=>{a.classList.remove('flip');c.classList.remove('flip');lock=false},800)}
}
function arenaGame(kind){
  const cv=$('arena');cv.style.display='block';
  const W=cv.width=Math.min(innerWidth-40,420),H=cv.height=Math.max(280,Math.min(innerHeight-230,520));
  const g=cv.getContext('2d');let score=0,things=[],bits=[],bx=W/2,t=0;const tEnd=Date.now()+ARENA_TIME*1000;
  const prog=()=>{const s=Math.max(0,Math.ceil((tEnd-Date.now())/1000));$('gprog').textContent=(kind==='bubbles'?'🔵 ':'⭐ ')+score+'   ⏱ '+s+L().left};prog();
  const spawn=()=>{ if(kind==='bubbles'){const r=26+Math.random()*22;things.push({x:r+Math.random()*(W-2*r),y:H+r,r:r,vy:1+Math.random()*1.4,ph:Math.random()*6,h:Math.random()*360})}
    else things.push({x:20+Math.random()*(W-40),y:-20,r:18,vy:1.8+Math.random()*1.6,rot:Math.random()*6,h:45}) };
  spawn();spawn();spawnT=setInterval(spawn,kind==='bubbles'?550:750);
  const pos=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}};
  cv.onpointermove=e=>{if(kind==='stars')bx=Math.max(40,Math.min(W-40,pos(e).x))};
  cv.onpointerdown=e=>{const p=pos(e);if(kind==='stars'){bx=Math.max(40,Math.min(W-40,p.x));return}
    for(let i=things.length-1;i>=0;i--){const b=things[i];if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+8){things.splice(i,1);pop(b);break}}};
  function burst(x,y,h){for(let i=0;i<10;i++)bits.push({x:x,y:y,vx:Math.cos(i*.63)*(2+Math.random()*2),vy:Math.sin(i*.63)*(2+Math.random()*2),l:1,h:h})}
  function pop(b){burst(b.x,b.y,b.h);tone(SC[Math.floor(Math.random()*6)]*1.5,ctx().currentTime,.18,'sine',.12);score++;prog()}
  function star(x,y,r,rot){g.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath()}
  (function loop(){
    t++;prog();if(Date.now()>=tEnd){stopArena();winGame(Math.min(score,BONUS_CAP),true);return}
    g.clearRect(0,0,W,H);
    const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,kind==='stars'?'#2b2a5c':'#bfe9ff');bg.addColorStop(1,kind==='stars'?'#6a4fb5':'#f3e6ff');g.fillStyle=bg;g.fillRect(0,0,W,H);
    for(let i=things.length-1;i>=0;i--){const b=things[i];
      if(kind==='bubbles'){b.y-=b.vy;b.x+=Math.sin(t/30+b.ph)*.6;
        const gr=g.createRadialGradient(b.x-b.r*.35,b.y-b.r*.35,b.r*.1,b.x,b.y,b.r);gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(.5,'hsla('+b.h+',90%,80%,.35)');gr.addColorStop(1,'hsla('+b.h+',90%,70%,.6)');
        g.fillStyle=gr;g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=2;g.stroke();
        if(b.y<-b.r*2)things.splice(i,1)}
      else{b.y+=b.vy;b.rot+=.04;g.shadowColor='#ffe27a';g.shadowBlur=14;g.fillStyle='#ffd84a';star(b.x,b.y,b.r,b.rot);g.fill();g.shadowBlur=0;
        if(b.y>H-46&&b.y<H-14&&Math.abs(b.x-bx)<46){things.splice(i,1);pop(b)}else if(b.y>H+30)things.splice(i,1)}}
    if(kind==='stars'){g.fillStyle='#ff7eb6';g.beginPath();g.moveTo(bx-46,H-44);g.lineTo(bx+46,H-44);g.quadraticCurveTo(bx+40,H-6,bx,H-6);g.quadraticCurveTo(bx-40,H-6,bx-46,H-44);g.fill();g.fillStyle='#fff8';g.fillRect(bx-46,H-48,92,6)}
    bits.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=.04;g.fillStyle='hsla('+p.h+',90%,70%,'+Math.max(p.l,0)+')';g.beginPath();g.arc(p.x,p.y,4,0,7);g.fill()});bits=bits.filter(p=>p.l>0);
    raf=requestAnimationFrame(loop)})();
}

function crittersGame(){

  let score=0;const cs=['🐰','🐹','🐥','🐱','🐸'],holes=[];

  for(let i=0;i<9;i++){const h=document.createElement('button');h.className='hole';h.innerHTML='<span></span>';
    h.onclick=()=>{if(h.classList.contains('up')){h.classList.remove('up');score++;tone(SC[Math.floor(Math.random()*6)]*1.5,ctx().currentTime,.18,'sine',.12);hud(sec)}};
    box.appendChild(h);holes.push(h)}
  spawnT=setInterval(()=>{const h=holes[Math.floor(Math.random()*9)];if(h.classList.contains('up'))return;
    h.firstChild.textContent=cs[Math.floor(Math.random()*cs.length)];h.classList.add('up');later(()=>h.classList.remove('up'),1100)},620);

function simonGame(){
  const box=$('dom');box.className='simon';box.style.display='grid';box.innerHTML='';
  const cols=['#ff6b8b','#5aa9ff','#ffc83d','#5fd8b4'],pads=[];let seq=[],pos=0,accept=false,rounds=0,sec=45;
  const hud=()=>$('gprog').textContent='🎵 '+rounds+'   ⏱ '+sec+L().left;
  function flash(i){pads[i].classList.add('lit');tone(SC[i],ctx().currentTime,.3,'triangle',.14);later(()=>pads[i].classList.remove('lit'),300)}
  function play(){accept=false;pos=0;seq.forEach((v,k)=>later(()=>flash(v),600+k*650));later(()=>{accept=true},600+seq.length*650)}
  function next(){seq.push(Math.floor(Math.random()*4));play()}
  function press(i){if(!accept)return;flash(i);
    if(i===seq[pos]){pos++;if(pos===seq.length){accept=false;rounds++;hud();chime();later(next,900)}}
    else{accept=false;later(play,800)}}
  cols.forEach((c,i)=>{const b=document.createElement('button');b.className='pad';b.style.background=c;b.onclick=()=>press(i);box.appendChild(b);pads.push(b)});
  next();runClock(45,()=>winGame(Math.min(rounds*3,BONUS_CAP),true),s=>{sec=s;hud()});
}
function countGame(){
  const box=$('dom');box.className='count';box.style.display='block';box.innerHTML='<div id="pile"></div><div id="opts"></div>';
  let score=0,sec=40;const E=['⭐','🍎','🐟','🌸','🍓','🎈'];
  const hud=()=>$('gprog').textContent='🔢 '+score+'   ⏱ '+sec+L().left;
  function round(){const n=1+Math.floor(Math.random()*9),e=E[Math.floor(Math.random()*E.length)];
    $('pile').innerHTML='';for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=e;s.style.transform='rotate('+(Math.random()*40-20)+'deg)';$('pile').appendChild(s)}
    const o=[n];while(o.length<3){const x=1+Math.floor(Math.random()*10);if(o.indexOf(x)<0)o.push(x)}
    o.sort(()=>Math.random()-.5);$('opts').innerHTML='';
    o.forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=v;
      b.onclick=()=>{if(v===n){score++;chime();hud();round()}else{b.classList.add('no');tone(220,ctx().currentTime,.2,'sine',.1)}};$('opts').appendChild(b)})}
  round();runClock(40,()=>winGame(Math.min(score*2,BONUS_CAP),true),s=>{sec=s;hud()});
}
function setInstallName(name,short){
  const m=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(m)m.content=short;
  const ln=document.querySelector('link[rel="manifest"]');if(!ln)return;
  if(!ln.dataset.src)ln.dataset.src=new URL(ln.getAttribute('href'),location.href).href;
  fetch(ln.dataset.src).then(r=>r.json()).then(j=>{const base=ln.dataset.src;
    j.name=name;j.short_name=short;j.start_url=new URL(j.start_url,base).href;j.scope=new URL(j.scope,base).href;

  gridView(['tabs','subtabs','shop'],{get grp(){return grp},set grp(x){grp=x},get tab(){return tab},set tab(x){tab=x}},'wardrobe');
  gridView(['stabs','ssub','sgrid'],{get grp(){return sgrp},set grp(x){sgrp=x},get tab(){return stab},set tab(x){stab=x}},'shop');
  const seg=$('pzseg');seg.innerHTML='';[['shop',l.pz.shop],['real',l.pz.real]].forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;b.className=pzv===k?'on':'';b.onclick=()=>{pzv=k;renderMe()};seg.appendChild(b)});
  $('shopview').style.display=pzv==='shop'?'':'none';$('realview').style.display=pzv==='real'?'':'none';
  $('shophello').textContent=l.pz.shopHello;
  const he=S.lang==='he',st=S.streak||0;
  $('stats').innerHTML='<span>🔥 '+st+(he?' ימים ברצף':' day streak')+'</span><span>💰 '+(S.life||0)+(he?' סה״כ':' earned')+'</span>'+(st>=3?'<span>🏅 '+(he?'להבה':'On fire')+'</span>':'')+((S.life||0)>=100?'<span>⭐ '+(he?'מאה מטבעות':'100 club')+'</span>':'');
}

/* ---------- shell ---------- */
function renderAll(){
  document.documentElement.style.setProperty('--hh',(document.querySelector('header').offsetHeight||70)+'px');
  const l=L();document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='he'?'rtl':'ltr';
  $('title').textContent=l.title;document.title=l.title;setInstallName(l.title,l.title);$('n1').textContent=l.tasks;$('n2').textContent=l.me;$('n3').textContent=l.pz.title;$('coins').textContent=S.coins;$('mute').textContent=S.mute?'🔇':'🔊';
  renderTasks();renderPrizes();renderMe();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p))});
$('lang').onclick=()=>{S.lang=S.lang==='en'?'he':'en';save();renderAll()};
$('mute').onclick=()=>{S.mute=!S.mute;if(S.mute)stopMusic();save();renderAll()};

/* ---------- pairing ---------- */
function showPair(msg){
  const p=L().pr;$('ptitle').textContent=p.title;$('pmsg').textContent=msg||p.msg;$('pcode').placeholder=p.code;$('pgo').textContent=p.go;$('pair').classList.add('on');
}
async function pairWith(code){
  code=(code||'').trim();
  if(!code)return;
  try{
    let {data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error}
    const r=await sb.rpc('claim_kid_invite',{p_code:code});
    if(r.error){showPair(L().pr.bad);return}
    LOC.kid=kidId=r.data;save();$('pair').classList.remove('on');history.replaceState(null,'',location.pathname);
    await refresh();
  }catch(e){showPair(L().pr.err)}
}
$('pgo').onclick=()=>{const v=$('pcode').value.trim();pairWith(v.includes('join=')?new URLSearchParams(v.split('?')[1]).get('join'):v)};
async function boot(){
  renderAll();
  const join=new URLSearchParams(location.search).get('join');
  if(join){await pairWith(join);return}
  const {data:{session}}=await sb.auth.getSession();
  if(!session||!kidId){showPair();return}
  try{await refresh()}catch(e){toast(L().pr.err)}
}
boot();
setInterval(()=>{if(kidId&&!busy&&!document.hidden&&!$('game').classList.contains('on'))refresh(true).catch(()=>{})},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&kidId&&!busy&&!$('game').classList.contains('on'))refresh(true).catch(()=>{})});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
